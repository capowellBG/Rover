[Kp]
MaxFeatures=500
# ORB: rotation-invariant, fast on ARM — better than default (SURF/BRIEF) during turns
DetectorStrategy=2

[Vis]
MaxFeatures=500
MinInliers=15

[OdomF2M]
MaxSize=3000

[Mem]
IncrementalMemory=true
InitWMWithAllNodes=false

[Rtabmap]
DetectionRate=1.0
# Stop processing if loop closure takes longer than 700ms (keeps Pi from falling behind)
TimeThr=700

[Reg]
# 0=Vis (visual), 1=ICP, 2=Vis+ICP
Strategy=0
Force3DoF=false

[Imu]
# 1=Madgwick filter
FilteringStrategy=1

[Odom]
GuessMotion=true
ResetCountdown=0

[RGBD]
# Prevents "Not found word" errors caused by split dictionary between odom and rtabmap nodes
TransferLatestOdomToRtabmap=false

[Grid]
# Normal segmentation classifies ground by surface orientation rather than height alone —
# works well now that the camera is upright and forward-facing.
NormalsSegmentation=true
# Camera is ~14.5in (0.37m) above floor, right-side up, tilted 15° down. TF has no z offset,
# so floor is at z≈-0.37 in base_link. Extra tolerance below for uneven floors.
MinGroundHeight=-0.43
MaxGroundHeight=-0.30
# Obstacles must rise at least ~7cm above floor level to be detected.
MinObstacleHeight=-0.30
MaxObstacleHeight=1.5
# Ignore points too close (rover body) or too far (noisy depth)
RangeMin=0.4
RangeMax=4.0
# Require a cluster of at least 50 points — removes scattered depth noise dots
MinClusterSize=50
# 10cm cells — coarser but dramatically cleaner than the 5cm default
CellSize=0.10
