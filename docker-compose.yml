x-service: &base
  image: rover:latest
  network_mode: host
  ipc: host
  entrypoint: /ros_entrypoint.sh
  volumes:
    - .:/ros_ws
  devices:
    - /dev/gpiochip0:/dev/gpiochip0
  privileged: true

services:

  foxglove_bridge:
    <<: *base
    command: ros2 run foxglove_bridge foxglove_bridge

  motor_driver:
    <<: *base
    command: python3 /ros_ws/scripts/motor_node.py

  robot_description:
    <<: *base
    command: ros2 launch /ros_ws/launch/robot.launch.py