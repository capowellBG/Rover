x-service: &base
  image: rover:latest
  network_mode: host
  ipc: host
  entrypoint: /ros_entrypoint.sh
  volumes:
    - ./motor_node.py:/ros_ws/motor_node.py
    - ./camera_config.yaml:/camera_config.yaml:ro
services:
  foxglove_bridge:
    <<: *base
    command: ros2 run foxglove_bridge foxglove_bridge --ros-args -p send_buffer_limit:=500000

  motor_driver:
    <<: *base
    privileged: true
    command: python3 /ros_ws/motor_node.py

  camera:
    <<: *base
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./cyclone_config.xml:/cyclone_config.xml:ro
      - ./camera_config.yaml:/camera_config.yaml:ro
    command: ros2 launch realsense2_camera rs_launch.py config_file:=/camera_config.yaml

  camera_tf:
    <<: *base
    command: >-
      ros2 run tf2_ros static_transform_publisher
        --frame-id base_link
        --child-frame-id camera_link
        --x 0 --y 0 --z 0
        --roll 0 --pitch 0 --yaw 0

  rtabmap:
    <<: *base
    volumes:
      - ./cyclone_config.xml:/cyclone_config.xml:ro
      - ./rtabmap_config.ini:/rtabmap_config.ini:ro
      - ./rtabmap_data:/data
    command: >-
      ros2 launch rtabmap_launch rtabmap.launch.py
        rgb_topic:=/camera/camera/color/image_raw
        depth_topic:=/camera/camera/aligned_depth_to_color/image_raw
        camera_info_topic:=/camera/camera/color/camera_info
        imu_topic:=/camera/camera/imu
        frame_id:=base_link
        cfg:=/rtabmap_config.ini
        database_path:=/data/rtabmap.db
        qos:=1
        delete_db_on_start:=true
        rviz:=false
        rtabmap_viz:=false
