x-service: &base
  image: rover:latest
  build: .
  network_mode: host
  ipc: host
  entrypoint: /ros_entrypoint.sh
  volumes:
    - .:/ros_ws
    - /dev/input:/dev/input
  devices:
    - /dev/gpiochip0:/dev/gpiochip0
    - /dev/bus/usb:/dev/bus/usb
    - /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_378e61c45266254bb4500e3f0a5aacfe-if00-port0:/dev/ttyUSB0
  privileged: true

services:

  foxglove_bridge:
    <<: *base
    command: ros2 run foxglove_bridge foxglove_bridge

  motor_driver:
    <<: *base
    command: python3 /ros_ws/scripts/motor_node.py

  joystick:
    <<: *base
    command: python3 /ros_ws/scripts/joystick_node.py

  # lidar:
  #   <<: *base
  #   privileged: true
  #   # command: ros2 launch /ros_ws/launch/lidar.launch.py slam_mode:=mapping
  #   command: ros2 launch /ros_ws/launch/lidar.launch.py slam_mode:=localization
  #   # command: ros2 launch /ros_ws/launch/lidar.launch.py slam_mode:=continue

  robot_description:
    <<: *base
    command: ros2 launch /ros_ws/launch/robot.launch.py

  # nav2:
  #   <<: *base
  #   command: ros2 launch /ros_ws/launch/nav2.launch.py

  camera:
    <<: *base
    command: ros2 launch realsense2_camera rs_launch.py config_file:=/ros_ws/config/camera_config.yaml

  # Visual-inertial odom (D455 + IMU) -> owns odom->base_footprint.
  # Needs camera + robot_description up (TF: base_footprint->camera_link->optical frames).
  camera_odom:
    <<: *base
    command: ros2 launch /ros_ws/launch/camera_odom.launch.py