[Kp]
MaxFeatures=500

[Vis]
MaxFeatures=500

[Mem]
IncrementalMemory=true
InitWMWithAllNodes=false

[Rtabmap]
DetectionRate=1.0
# Stop processing if loop closure takes longer than 700ms (keeps Pi from falling behind)
TimeThr=700

[Reg]
# 0=Vis (visual), 1=ICP, 2=Vis+ICP
Strategy=0
Force3DoF=false

[Imu]
# 1=Madgwick filter
FilteringStrategy=1

[Odom]
# D455 has no factory IMU calibration, so don't use IMU as rotation guess for visual odometry
GuessMotion=true
GuessFromMotion=false
# Disable odom resets to prevent dictionary mismatches
ResetCountdown=0

[RGBD]
# Prevents "Not found word" errors caused by split dictionary between odom and rtabmap nodes
TransferLatestOdomToRtabmap=false
